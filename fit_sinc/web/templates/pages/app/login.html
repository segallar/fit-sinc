{% extends "layouts/auth.html" %}

{% block title %}Login — fit_sinc{% endblock %}

{% block page_content %}
<h2 class="mb-6 text-xl font-semibold text-slate-900">Sign in</h2>
{% if error %}
<p class="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-900">Invalid email or password</p>
{% endif %}
<form method="post" action="{{ prefix }}/login" class="space-y-4">
  <label class="block text-sm text-slate-600">
    <span class="mb-1 block">Email</span>
    <input type="email" name="email" required autocomplete="username"
           class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500">
  </label>
  <label class="block text-sm text-slate-600">
    <span class="mb-1 block">Password</span>
    <input type="password" name="password" required autocomplete="current-password"
           class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm shadow-sm focus:border-teal-500 focus:outline-none focus:ring-1 focus:ring-teal-500">
  </label>
  <button type="submit"
          class="w-full rounded-lg bg-teal-700 px-4 py-2 text-sm font-semibold text-white hover:bg-teal-800">
    Sign in
  </button>
</form>
{% endblock %}
