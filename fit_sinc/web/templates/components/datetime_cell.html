{% set parts = fmt_datetime_safe(iso) %}
{% if parts.date %}
<time class="dt whitespace-nowrap tabular-nums"{% if iso %} datetime="{{ iso }}"{% endif %}>
  <span class="dt-date block font-medium text-slate-900">{{ parts.date }}</span>
  {% if parts.time %}<span class="dt-time block text-xs text-slate-500">{{ parts.time }}</span>{% endif %}
</time>
{% else %}
<span class="text-slate-400">—</span>
{% endif %}
