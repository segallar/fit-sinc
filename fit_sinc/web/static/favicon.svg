<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="fit_sinc">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- left node (source) -->
  <circle cx="148" cy="256" r="44" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.95"/>
  <!-- right node (destination) -->
  <circle cx="364" cy="256" r="44" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.95"/>
  <!-- sync arrow top -->
  <path
    d="M 192 220 C 240 180 272 180 320 220"
    fill="none"
    stroke="url(#arrow)"
    stroke-width="22"
    stroke-linecap="round"
  />
  <path
    d="M 304 206 L 320 220 L 306 234"
    fill="none"
    stroke="url(#arrow)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- sync arrow bottom -->
  <path
    d="M 320 292 C 272 332 240 332 192 292"
    fill="none"
    stroke="url(#arrow)"
    stroke-width="22"
    stroke-linecap="round"
    opacity="0.85"
  />
  <path
    d="M 208 278 L 192 292 L 206 306"
    fill="none"
    stroke="url(#arrow)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />
  <!-- center FIT dot -->
  <circle cx="256" cy="256" r="18" fill="#ffffff"/>
</svg>
