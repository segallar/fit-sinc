server {
    listen 80;
    server_name fit.romansegalla.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fit.romansegalla.online;

    ssl_certificate /etc/letsencrypt/live/fit.romansegalla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.romansegalla.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        auth_basic "fit_sinc";
        auth_basic_user_file /etc/nginx/.htpasswd_fit_sinc;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
