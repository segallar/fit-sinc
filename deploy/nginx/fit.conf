# fit.romansegalla.online — legacy app host → 301 на app.getsync.me
#
# После cutover 1.5: не проксируем на :8080, только редирект (сохраняем path + query).
# Сертификат остаётся для HTTPS на старом host; certbot renew — как раньше.
#
# Deploy:
#   scp -i ~/.ssh/id_ed25519 deploy/nginx/fit.conf \
#     root@sirocco.romansegalla.online:/etc/nginx/conf.d/fit.conf
#   ssh -i ~/.ssh/id_ed25519 root@sirocco.romansegalla.online \
#     'nginx -t && systemctl reload nginx'
#
# Smoke:
#   curl -sI https://fit.romansegalla.online/health | grep -i '^[Ll]ocation:'
#   curl -sk https://app.getsync.me/health

server {
    listen 80;
    listen [::]:80;
    server_name fit.romansegalla.online;
    return 301 https://app.getsync.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fit.romansegalla.online;

    ssl_certificate /etc/letsencrypt/live/fit.romansegalla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.romansegalla.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://app.getsync.me$request_uri;
}
