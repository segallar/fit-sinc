# getsync.me + app.getsync.me — proxy to uvicorn :8080 (session auth in app)
#
# DNS (вариант A): GoDaddy NS ns37/ns38.domaincontrol.com, A @ и app → sirocco IP
#
# Deploy:
#   scp deploy/nginx/getsync.conf root@sirocco:/etc/nginx/conf.d/getsync.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d getsync.me -d app.getsync.me

server {
    listen 80;
    server_name getsync.me www.getsync.me app.getsync.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name getsync.me www.getsync.me app.getsync.me;

    ssl_certificate /etc/letsencrypt/live/getsync.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getsync.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /webhooks/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /favicon.ico {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
