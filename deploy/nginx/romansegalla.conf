# romansegalla.online — landing page
#
# Deploy:
#   scp deploy/www/index.html root@sirocco:/var/www/html/
#   ssh root@sirocco "sed -i 's/index  index.php/index index.html index.php/' /etc/nginx/sites-available/default && nginx -t && systemctl reload nginx"

server {
    server_name romansegalla.online www.romansegalla.online;

    root /var/www/html;
    index index.html index.php;

    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/romansegalla.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/romansegalla.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security 'max-age=604800';

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name romansegalla.online www.romansegalla.online;
    return 301 https://$host$request_uri;
}
