[project]
name = "fit-sinc"
version = "0.3.2"
description = "Sync Hammerhead Karoo workouts to Garmin Connect"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "garth-ng>=1.1.0",
    "playwright>=1.49.0",
]

[project.scripts]
fit_sinc = "fit_sinc.cli:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fit_sinc*"]

[tool.setuptools.package-data]
fit_sinc = ["web/static/*"]
