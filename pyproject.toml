[project]
name = "get-sync"
version = "0.7.0"
description = "GetSync — sync workouts across fitness platforms (Hammerhead → Garmin)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.15.0",
    "garth-ng>=1.1.0",
    "playwright>=1.49.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
getsync = "getsync.cli:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["getsync*"]

[tool.setuptools.package-data]
getsync = ["web/static/*", "web/templates/**/*.html"]
