# GetSync — test on push/PR; deploy to sirocco + breeze on push to main/master/hotfix/*

name: CI

on:
  push:
    branches: [main, master, "hotfix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Org/repo may default GITHUB_TOKEN to read-only; explicit scopes avoid checkout 403.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Compile
        run: python -m compileall -q getsync

      - name: Smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  deploy:
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - sirocco.romansegalla.online
          - breeze.romansegalla.online
    # If deploy fails with exit 1, check Actions log: health poll or pip import smoke test.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to ${{ matrix.host }}
        env:
          GETSYNC_DEPLOY_NUMBER: ${{ github.run_number }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GETSYNC_SSH_HOST: ${{ matrix.host }}
          GETSYNC_SSH_USER: ${{ vars.GETSYNC_SSH_USER }}
          GETSYNC_DEPLOY_PATH: ${{ vars.GETSYNC_DEPLOY_PATH }}
        run: |
          chmod +x scripts/ci/deploy.sh
          ./scripts/ci/deploy.sh
