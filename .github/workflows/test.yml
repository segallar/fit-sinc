# GetSync — parallel CI: lint ∥ unit ∥ integration; e2e on main/nightly/label/release

name: CI

on:
  push:
    branches: [main, master, "hotfix/**"]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check tests/unit tests/integration tests/e2e

      - name: Compile
        run: python -m compileall -q getsync

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py" -v

  e2e:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'e2e'))
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: E2E tests
        env:
          GETSYNC_E2E_BASE_URL: ${{ vars.GETSYNC_STAGING_URL }}
          HAMMERHEAD_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
        run: python -m unittest discover -s tests/e2e -p "test_*.py" -v

  deploy:
    needs: [lint, unit, integration]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to breeze
        env:
          GETSYNC_DEPLOY_NUMBER: ${{ github.run_number }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GETSYNC_SSH_HOST: breeze.romansegalla.online
          GETSYNC_SSH_USER: ${{ vars.GETSYNC_SSH_USER }}
          GETSYNC_DEPLOY_PATH: ${{ vars.GETSYNC_DEPLOY_PATH }}
        run: |
          chmod +x scripts/ci/deploy.sh
          ./scripts/ci/deploy.sh
