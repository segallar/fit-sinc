# GetSync — test on push/PR; deploy to sirocco on push to main/master/hotfix/* (same workflow, no workflow_run delay)

name: CI

on:
  push:
    branches: [main, master, "hotfix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Org/repo may default GITHUB_TOKEN to read-only; explicit scopes avoid checkout 403.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Compile
        run: python -m compileall -q getsync

      - name: Smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  deploy:
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to sirocco
        env:
          GETSYNC_DEPLOY_NUMBER: ${{ github.run_number }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GETSYNC_SSH_HOST: ${{ vars.GETSYNC_SSH_HOST }}
          GETSYNC_SSH_USER: ${{ vars.GETSYNC_SSH_USER }}
          GETSYNC_DEPLOY_PATH: ${{ vars.GETSYNC_DEPLOY_PATH }}
          FIT_SINC_SSH_HOST: ${{ vars.FIT_SINC_SSH_HOST }}
          FIT_SINC_SSH_USER: ${{ vars.FIT_SINC_SSH_USER }}
          FIT_SINC_DEPLOY_PATH: ${{ vars.FIT_SINC_DEPLOY_PATH }}
        run: |
          chmod +x scripts/ci/deploy.sh
          ./scripts/ci/deploy.sh
