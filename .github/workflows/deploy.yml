# GetSync — deploy to sirocco after successful Test on push to main
#
# Secrets: SSH_PRIVATE_KEY
# Optional vars: GETSYNC_SSH_HOST, GETSYNC_SSH_USER, GETSYNC_DEPLOY_PATH (legacy FIT_SINC_* still work in deploy.sh)

name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main, master]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install rsync and SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync openssh-client

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Tailwind CSS
        run: chmod +x scripts/ci/build-frontend-css.sh && ./scripts/ci/build-frontend-css.sh

      - name: Deploy to sirocco
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GETSYNC_SSH_HOST: ${{ vars.GETSYNC_SSH_HOST }}
          GETSYNC_SSH_USER: ${{ vars.GETSYNC_SSH_USER }}
          GETSYNC_DEPLOY_PATH: ${{ vars.GETSYNC_DEPLOY_PATH }}
          FIT_SINC_SSH_HOST: ${{ vars.FIT_SINC_SSH_HOST }}
          FIT_SINC_SSH_USER: ${{ vars.FIT_SINC_SSH_USER }}
          FIT_SINC_DEPLOY_PATH: ${{ vars.FIT_SINC_DEPLOY_PATH }}
        run: |
          chmod +x scripts/ci/deploy.sh
          ./scripts/ci/deploy.sh
