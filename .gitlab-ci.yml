# fit_sinc — test on MR/push, deploy to sirocco on main
# Variables (Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY (File, masked) — private key for root@sirocco
# Optional:
#   FIT_SINC_SSH_HOST (default: sirocco.romansegalla.online)
#   FIT_SINC_SSH_USER   (default: root)
#   FIT_SINC_DEPLOY_PATH (default: /opt/fit_sinc)

stages:
  - test
  - deploy

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

.test_base:
  image: python:3.12-bookworm
  before_script:
    - pip install -e .

test:
  extends: .test_base
  stage: test
  script:
    - python -m compileall -q fit_sinc
    - python -m unittest discover -s tests -p "test_*.py" -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

deploy:production:
  stage: deploy
  image: python:3.12-bookworm
  needs: [test]
  before_script:
    - apt-get update -qq && apt-get install -y -qq rsync openssh-client
    - chmod +x scripts/ci/deploy.sh
  script:
    - ./scripts/ci/deploy.sh
  environment:
    name: production
    url: https://fit.romansegalla.online
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
