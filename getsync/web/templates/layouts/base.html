<!DOCTYPE html>
<html lang="{% block html_lang %}en{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GetSync{% endblock %}</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXg0btuH9tYUpqlf/Ei" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <div class="{% block container_class %}container{% endblock %} py-4 flex-grow-1">
    {% block header %}
    <header class="d-flex align-items-center gap-3 mb-4">
      <img src="/static/icon.svg" alt="" width="48" height="48" class="rounded-3 shadow-sm">
      <div>
        <p class="getsync-brand-sub mb-0">Hammerhead → Garmin</p>
        <h1 class="h3 mb-0 fw-semibold">GetSync</h1>
      </div>
    </header>
    {% endblock %}
    {% block header_extra %}{% endblock %}
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="getsync-footer text-muted small">
      {% block footer_extra %}{% endblock %}
      {% include "components/build_footer.html" %}
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
</body>
</html>
