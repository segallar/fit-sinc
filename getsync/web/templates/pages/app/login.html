{% extends "layouts/auth.html" %}

{% block title %}Login — GetSync{% endblock %}

{% block page_content %}
<h2 class="h4 mb-4">Sign in</h2>
{% if error %}
<div class="alert alert-danger">Invalid email or password</div>
{% endif %}
<form method="post" action="{{ prefix }}/login">
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required autocomplete="username">
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control" required autocomplete="current-password">
  </div>
  <button type="submit" class="btn btn-primary w-100">Sign in</button>
</form>
{% if registration_open %}
<p class="mt-3 mb-0 text-center small text-muted">
  Нет аккаунта? <a href="/register">Sign up</a>
</p>
{% endif %}
{% endblock %}

{% block footer_extra %}
<p class="mb-0"><a href="/">Главная</a></p>
{% endblock %}
