<div class="mb-3">
  <label class="form-label">{{ label or 'Language' }}</label>
  <select name="{{ select_name or 'locale' }}" class="form-select" required>
    {% for label_text, value, is_sel in locale_options(selected) %}
    <option value="{{ value }}" {% if is_sel %}selected{% endif %}>{{ label_text }}</option>
    {% endfor %}
  </select>
</div>
