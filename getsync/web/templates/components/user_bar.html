<div class="card getsync-user-bar border-primary-subtle mb-4">
  <div class="card-body py-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div class="user-bar-info">
      <p class="mb-0 fw-semibold">{{ current_user.display_name }}</p>
      <p class="mb-0 small text-muted">
        {{ current_user.email }} · <code>{{ current_user.slug }}</code>
      </p>
      {% if current_user.is_admin or current_user.disabled %}
      <div class="mt-1">
        {% if current_user.is_admin %}
        <span class="badge bg-primary">{{ t.badge_admin }}</span>
        {% endif %}
        {% if current_user.disabled %}
        <span class="badge bg-danger">{{ t.badge_disabled }}</span>
        {% endif %}
      </div>
      {% endif %}
    </div>
    <a href="{{ prefix }}/logout" class="btn btn-outline-primary btn-sm">{{ t.logout }}</a>
  </div>
</div>
