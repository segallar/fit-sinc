{# source: hammerhead | garmin
   Assets: static/brands/ — Garmin Connect app tile (developer.garmin.com),
   Hammerhead mark (support.hammerhead.io press/theming). #}
{% if source == 'hammerhead' %}
<span class="getsync-source-icon getsync-source-icon--hammerhead" role="img" aria-label="Hammerhead" title="Hammerhead">
  <img src="/static/brands/hammerhead.jpg" alt="" width="22" height="22" decoding="async" loading="lazy">
</span>
{% elif source == 'garmin' %}
<span class="getsync-source-icon getsync-source-icon--garmin" role="img" aria-label="Garmin Connect" title="Garmin Connect">
  <img src="/static/brands/garmin-connect.png" alt="" width="22" height="22" decoding="async" loading="lazy">
</span>
{% else %}
<span class="text-muted" title="{{ source or 'unknown' }}">—</span>
{% endif %}
