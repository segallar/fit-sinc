{# source: hammerhead | garmin #}
{% if source == 'hammerhead' %}
<span class="getsync-source-icon getsync-source-icon--hammerhead" role="img" aria-label="Hammerhead" title="Hammerhead">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <rect x="3" y="5" width="18" height="14" rx="3" fill="#1c1c1c"/>
    <rect x="5" y="7" width="14" height="9" rx="1.5" fill="#f39200"/>
    <circle cx="12" cy="11.5" r="2.25" fill="#1c1c1c"/>
  </svg>
</span>
{% elif source == 'garmin' %}
<span class="getsync-source-icon getsync-source-icon--garmin" role="img" aria-label="Garmin" title="Garmin">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path fill="#007cc3" d="M3 3h18L12 21 3 3z"/>
    <path fill="#fff" d="M12 6.8 16.2 18H7.8L12 6.8z"/>
  </svg>
</span>
{% else %}
<span class="text-muted" title="{{ source or 'unknown' }}">—</span>
{% endif %}
