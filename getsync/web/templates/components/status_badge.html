{% macro status_badge(status, detail=None) %}
{% set classes = {
  "synced": "bg-success",
  "error": "bg-danger",
  "pending": "bg-warning text-dark",
  "not synced": "bg-secondary",
  "skipped": "bg-secondary",
} %}
<span class="badge {{ classes.get(status, 'bg-secondary') }}"
      {% if detail %}title="{{ detail }}"{% endif %}>{{ status }}</span>
{% endmacro %}
