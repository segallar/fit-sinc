{# title (required); hint (tooltip on ⓘ); lead / lead_html (optional subtitle) #}
<div class="getsync-page-header d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
  <div>
    <h1 class="h4 mb-0 fw-semibold d-flex align-items-center gap-2">
      <span>{{ title }}</span>
      {% if hint %}
      <span class="getsync-page-hint text-muted" title="{{ hint }}" tabindex="0" role="note" aria-label="{{ hint }}">?</span>
      {% endif %}
    </h1>
    {% if lead_html %}
    <p class="text-muted small mb-0 mt-1">{{ lead_html | safe }}</p>
    {% elif lead %}
    <p class="text-muted small mb-0 mt-1">{{ lead }}</p>
    {% endif %}
  </div>
</div>
