<form class="resync-form d-inline" method="post" action="{{ prefix }}/activities/{{ activity_id | urlencode }}/retry"
      {% if force_confirm %}onsubmit="return confirm('Already synced. Upload this activity to Garmin again?');"{% endif %}>
  <input type="hidden" name="next" value="{{ return_url }}">
  <button type="submit" class="btn btn-outline-secondary btn-sm">{{ label }}</button>
</form>
