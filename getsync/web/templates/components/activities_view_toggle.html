<div class="btn-group getsync-view-toggle flex-shrink-0" role="group" aria-label="Activities view">
  <a href="{{ prefix }}/activities?{{ activities_tab_query('list') }}"
     class="btn btn-sm{% if activities_view == 'list' %} btn-primary{% else %} btn-outline-primary{% endif %}"
     {% if activities_view == 'list' %}aria-current="page"{% endif %}>List</a>
  <a href="{{ prefix }}/activities?{{ activities_tab_query('calendar') }}"
     class="btn btn-sm{% if activities_view == 'calendar' %} btn-primary{% else %} btn-outline-primary{% endif %}"
     {% if activities_view == 'calendar' %}aria-current="page"{% endif %}>Calendar</a>
  <button type="button" class="btn btn-sm btn-outline-primary" disabled title="Planned">Map</button>
</div>
