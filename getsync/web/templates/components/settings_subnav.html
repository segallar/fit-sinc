<nav class="getsync-settings-subnav" aria-label="Settings sections">
  <ul class="nav flex-column getsync-settings-nav-list">
    <li class="nav-item">
      <a class="nav-link {% if settings_section == 'profile' %}active{% endif %}"
         href="{{ prefix }}/settings?section=profile"
         {% if settings_section == 'profile' %}aria-current="page"{% endif %}>
        {{ t.profile_h3 }}
      </a>
    </li>
    <li class="nav-item getsync-settings-nav-group">
      <span class="getsync-settings-nav-group-label">{{ t.settings_connections_h3 }}</span>
      <ul class="nav flex-column getsync-settings-nav-sublist">
        {% for item in settings_nav_connections %}
        <li class="nav-item">
          <a class="nav-link {% if settings_section == item.id %}active{% endif %}{% if not item.available %} getsync-settings-nav-link--muted{% endif %}"
             href="{{ prefix }}/settings?section={{ item.id }}"
             {% if settings_section == item.id %}aria-current="page"{% endif %}>
            {{ item.name }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if settings_section == 'password' %}active{% endif %}"
         href="{{ prefix }}/settings?section=password"
         {% if settings_section == 'password' %}aria-current="page"{% endif %}>
        {{ t.password_h3 }}
      </a>
    </li>
  </ul>
</nav>
