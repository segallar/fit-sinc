<div class="card shadow-sm getsync-settings-card mb-0">
  <div class="table-responsive">
    <table class="table table-hover table-sm mb-0 getsync-admin-table">
      <thead class="table-light">
        <tr>
          <th class="getsync-admin-col-time">Time</th>
          {% if show_user_column %}
          <th class="getsync-admin-col-user">User</th>
          {% endif %}
          <th class="getsync-admin-col-trigger">Trigger</th>
          <th class="getsync-admin-col-event">Event</th>
          <th class="getsync-admin-col-message">Message</th>
        </tr>
      </thead>
      <tbody>
        {% for e in garmin_session_events %}
        <tr>
          <td class="getsync-admin-col-time getsync-admin-col-mono">{{ fmt_date(e.created_at) }}</td>
          {% if show_user_column %}
          <td class="getsync-admin-col-user getsync-admin-col-mono">{{ e.user_label }}</td>
          {% endif %}
          <td class="getsync-admin-col-trigger">{{ e.trigger }}</td>
          <td class="getsync-admin-col-event fw-medium {% if e.status_class == 'ok' %}text-success{% elif e.status_class == 'failed' %}text-danger{% endif %}">{{ e.event_type }}</td>
          <td class="getsync-admin-col-message">{{ e.message }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="{{ 5 if show_user_column else 4 }}" class="text-center text-muted py-4">No refresh events yet.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
