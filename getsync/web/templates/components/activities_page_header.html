{# hint, filters, filter_form_id; requires activities_view + activities_tab_query #}
<div class="getsync-page-header getsync-activities-page-header d-flex flex-wrap justify-content-between align-items-center gap-2 gap-md-3 mb-3">
  <h1 class="h4 mb-0 fw-semibold d-flex align-items-center gap-2">
    <span>Activities</span>
    <div class="dropdown">
      <button type="button"
              class="getsync-page-hint dropdown-toggle text-muted"
              data-bs-toggle="dropdown"
              data-bs-auto-close="outside"
              aria-expanded="false"
              aria-label="About Activities and source filter">?</button>
      <div class="dropdown-menu getsync-activities-hint-menu shadow-sm p-3">
        {% if hint %}
        <p class="small text-muted mb-2 mb-md-3">{{ hint }}</p>
        {% endif %}
        <label class="form-label small mb-1" for="activities-source-filter">Source</label>
        <select id="activities-source-filter"
                name="source"
                class="form-select form-select-sm"
                form="{{ filter_form_id | default('activities-filter-form') }}">
          <option value=""{% if not filters.source %} selected{% endif %}>All sources</option>
          <option value="hammerhead"{% if filters.source == 'hammerhead' %} selected{% endif %}>Hammerhead</option>
          <option value="garmin"{% if filters.source == 'garmin' %} selected{% endif %}>Garmin</option>
        </select>
      </div>
    </div>
  </h1>
  {% include "components/activities_tabs.html" %}
</div>
