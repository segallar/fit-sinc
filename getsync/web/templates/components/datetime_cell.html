{% set parts = fmt_datetime_safe(iso) %}
{% if parts.date %}
<time class="dt"{% if iso %} datetime="{{ iso }}"{% endif %}>
  <span class="d-block fw-medium">{{ parts.date }}</span>
  {% if parts.time %}<span class="d-block small text-muted">{{ parts.time }}</span>{% endif %}
</time>
{% else %}
<span class="text-muted">—</span>
{% endif %}
