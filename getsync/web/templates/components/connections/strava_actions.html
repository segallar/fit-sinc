<div class="d-flex flex-wrap gap-2">
  {% if conn.strava_oauth_configured %}
  <a href="{{ prefix }}/settings/strava/connect" class="btn btn-primary btn-sm">Connect Strava</a>
  {% else %}
  <p class="small text-muted mb-0">OAuth not configured on server (STRAVA_CLIENT_ID).</p>
  {% endif %}
  <form method="post" action="{{ prefix }}/settings/strava/disconnect"
        onsubmit="return confirm('Disconnect Strava tokens for this account?');">
    <button type="submit" class="btn btn-outline-secondary btn-sm">Disconnect</button>
  </form>
</div>
<p class="small text-muted mt-3 mb-0">
  Redirect URI: <code class="small">{{ prefix }}/settings/strava/callback</code>
</p>
